<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradLoom — Campus Careers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><span>G</span><i></i></div>
        <div>
          <div class="brand-name">GradLoom</div>
          <div class="brand-sub">Campus Careers</div>
        </div>
      </div>

      <nav class="nav-section">
        <div class="nav-label">WORKSPACE</div>
        <button class="nav-item active" data-page="dashboard"><span>◈</span> Overview</button>
        <button class="nav-item" data-page="students"><span>♙</span> Student Hub</button>
        <button class="nav-item" data-page="companies"><span>◫</span> Recruiters</button>
        <button class="nav-item" data-page="drives"><span>◌</span> Hiring Events</button>
        <button class="nav-item" data-page="applications"><span>✦</span> Applications</button>
        <button class="nav-item" data-page="interviews"><span>◷</span> Interview Planner</button>
        <button class="nav-item" data-page="pipeline"><span>⌁</span> Talent Flow</button>
        <button class="nav-item" data-page="analytics"><span>◒</span> Insights</button>
      </nav>

      <nav class="nav-section management">
        <div class="nav-label">CONTROL ROOM</div>
        <button class="nav-item" data-page="criteria"><span>◇</span> Role Criteria</button>
        <button class="nav-item" data-page="settings"><span>⚙</span> Preferences</button>
      </nav>

      <div class="sidebar-note">
        <div class="note-symbol">✦</div>
        <div>
          <strong>Placement Pulse</strong>
          <small>12 recruiters active today</small>
        </div>
      </div>

      <div class="profile">
        <div class="avatar">MR</div>
        <div>
          <strong>Meera Rao</strong>
          <small>Career Cell Lead</small>
        </div>
        <span class="dots">•••</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="search-box">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Search students, recruiters, events...">
        </div>
        <div class="top-actions">
          <button class="icon-btn" title="Notifications">♢<i></i></button>
          <div class="user-mini">
            <div class="avatar small">MR</div>
            <div><strong>Meera Rao</strong><small>Career Cell Lead</small></div>
            <span>⌄</span>
          </div>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
